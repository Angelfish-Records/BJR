# .github/workflows/semgrep.yml
name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 14 * * 4'   # weekly
  workflow_dispatch:        # manual run button

permissions:
  contents: read
  security-events: write    # needed to upload SARIF

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run Semgrep (Community Edition – no account needed)
        run: |
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --exclude '.sanity/runtime/**' \
            --sarif \
            --output=semgrep.sarif
        # Baseline mode: findings are uploaded to GitHub Code Scanning
        # without making every Community rule match fail the workflow.

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
